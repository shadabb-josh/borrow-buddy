databases:
  - name: borrowbuddy
    databaseName: borrowbuddy
    user: borrowbuddy
    plan: free

services:
  - type: web
    name: borrowbuddy
    runtime: ruby
    plan: free
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec rails server"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: borrowbuddy
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync:false- key: WEB_CONCURRENCY
        value: 2 #senstible default